name: Deploy to Cloudflare Workers

# Fully self-bootstrapping deploy for larp.jasonshong.com: creates the D1
# database on first run, injects its id, applies migrations, deploys the
# Worker (which auto-provisions the custom domain + certificate), and sets
# SESSION_SECRET if it isn't set yet.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — "Edit Cloudflare Workers" token template, plus
#                           Account → D1 → Edit
#   CLOUDFLARE_ACCOUNT_ID — from the Cloudflare dashboard (Workers & Pages
#                           overview, right sidebar)
#   SESSION_SECRET        — any long random string (40+ characters)
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      seed:
        description: "Load demo data (seed.sql) after deploying"
        type: boolean
        default: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ensure the D1 database exists and resolve its id
        id: d1
        run: |
          set -euo pipefail
          lookup() { npx wrangler d1 list --json | jq -r '.[] | select(.name=="guildhall") | .uuid'; }
          ID="$(lookup || true)"
          if [ -z "$ID" ]; then
            npx wrangler d1 create guildhall
            ID="$(lookup)"
          fi
          echo "Database id: $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Inject the database id into wrangler.jsonc
        run: sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${{ steps.d1.outputs.id }}/" wrangler.jsonc

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply guildhall --remote

      - name: Build and deploy the Worker
        run: npm run deploy

      - name: Set SESSION_SECRET (first deploy only)
        run: |
          set -euo pipefail
          if npx wrangler secret list | grep -q '"SESSION_SECRET"'; then
            echo "SESSION_SECRET already set — leaving it unchanged."
          else
            printf '%s' "${{ secrets.SESSION_SECRET }}" | npx wrangler secret put SESSION_SECRET
          fi

      - name: Load demo data
        if: ${{ inputs.seed }}
        run: npm run db:seed:remote
