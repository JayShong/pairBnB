# Production deployment for https://larp.jasonshong.com
#
# On the server:
#   1. Point DNS: larp.jasonshong.com A/AAAA record -> this server's IP
#   2. Copy this directory (deploy/) to the server
#   3. Create deploy/.env with:  SESSION_SECRET=<openssl rand -hex 32>
#   4. docker compose up -d
#
# Caddy obtains and renews the TLS certificate for larp.jasonshong.com
# automatically. The SQLite database lives in the guildhall-data volume.
services:
  app:
    image: ghcr.io/jayshong/pairbnb:latest
    # To build from source on the server instead of pulling the image:
    #   build: ..
    restart: unless-stopped
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in deploy/.env}
      NEXT_PUBLIC_SITE_URL: https://larp.jasonshong.com
    volumes:
      - guildhall-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  guildhall-data:
  caddy-data:
  caddy-config:
